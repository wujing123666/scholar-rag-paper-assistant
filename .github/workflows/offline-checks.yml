name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ANONYMIZED_TELEMETRY: "False"
      SCHOLARRAG_TEST_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install tested dependencies
        run: python -m pip install -e ".[dev,rerank]" -c requirements-ci.txt
      - name: Unit tests (no external model credentials)
        run: python -m pytest tests/unit -q --basetemp=tmp/ci-pytest
      - name: Public dataset and source-page smoke
        run: python -m scripts.check_paper_demo --output tmp/ci-demo.json
      - name: Recalculate published metrics
        run: python -m scripts.recalculate_benchmarks --output tmp/ci-benchmarks.json
      - name: Save offline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-reports
          path: |
            tmp/ci-demo.json
            tmp/ci-benchmarks.json
          if-no-files-found: ignore
