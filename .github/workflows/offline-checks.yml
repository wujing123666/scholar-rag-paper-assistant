name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ANONYMIZED_TELEMETRY: "False"
      SCHOLARRAG_TEST_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install tested dependencies
        run: python -m pip install -e ".[dev,rerank,web]" -c requirements-ci.txt
      - name: Check API contract snapshot
        run: |
          python -m scripts.export_web_openapi
          git diff --exit-code -- frontend/openapi.json
      - name: Unit tests (no external model credentials)
        run: |
          python -c "from pathlib import Path; Path('tmp').mkdir(exist_ok=True)"
          python -m pytest tests/unit -q --basetemp=tmp/ci-pytest
      - name: Public dataset and source-page smoke
        run: python -m scripts.check_paper_demo --output tmp/ci-demo.json
      - name: Recalculate published metrics
        run: python -m scripts.recalculate_benchmarks --output tmp/ci-benchmarks.json
      - name: Save offline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-reports
          path: |
            tmp/ci-demo.json
            tmp/ci-benchmarks.json
          if-no-files-found: ignore
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - name: Check generated TypeScript contract
        run: |
          pnpm exec openapi-typescript openapi.json -o src/api/generated.ts
          git diff --exit-code -- src/api/generated.ts
      - run: pnpm test
      - run: pnpm build
